name: CI - Test & Generate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ffmpeg, espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers with system deps
        run: playwright install chromium --with-deps

      - name: Run pytest test suite (full verification with must_run gates)
        run: pytest tests/ -v

      - name: Run video generator on vidsearch_py (default backends)
        run: |
          python -m src.cli generate tests/fixtures/vidsearch_py --out out/

      - name: Verify outputs (MP4 with audible voice, companion assets, eval gates passed)
        run: |
          test -s out/video.mp4 || { echo "ERROR: out/video.mp4 is missing or empty"; exit 1; }
          test -s out/transcript.vtt || { echo "ERROR: out/transcript.vtt missing"; exit 1; }
          test -s out/chapters.json || { echo "ERROR: out/chapters.json missing"; exit 1; }
          test -s out/index.jsonl || { echo "ERROR: out/index.jsonl missing"; exit 1; }
          python -c "import json; r = json.load(open('out/eval_report.json')); assert r['all_gates_passed'] is True, f'Gates failed: {r}'"
          echo "[OK] out/video.mp4 and all companion outputs verified successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devvideo-ci-artifacts
          path: |
            out/video.mp4
            out/transcript.vtt
            out/chapters.json
            out/index.jsonl
            out/thumbnail.png
            out/eval_report.json
            out/manifest.json
            out/scenes.json
          if-no-files-found: warn
