name: CI - Test & Generate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (ffmpeg, espeak)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers with system deps
        run: playwright install chromium --with-deps

      - name: Run pytest test suite (full verification)
        run: pytest tests/ -v --tb=short

      - name: Run video generator on fixture repo (offline planner, silent TTS)
        run: |
          python -m src.main generate tests/fixture_repo --out out/ --llm offline --tts silent

      - name: Verify outputs (non-empty MP4 and all eval gates passed)
        run: |
          test -s out/video.mp4 || { echo "ERROR: out/video.mp4 is missing or empty"; exit 1; }
          python -c "import json; r = json.load(open('out/eval_report.json')); assert r['all_gates_passed'] is True, f'Gates failed: {r}'"
          echo "[OK] out/video.mp4 and out/eval_report.json successfully verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devvideo-ci-artifacts
          path: |
            out/video.mp4
            out/eval_report.json
            out/manifest.json
            out/scenes.json
          if-no-files-found: warn
