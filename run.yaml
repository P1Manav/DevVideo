# Commands for the AIntropy evaluator to run.
# These are run exactly as written, in order, from a fresh checkout.

setup_commands:
  - "pip install -r requirements.txt"
  - "playwright install chromium --with-deps"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py generate tests/fixture_repo --out out/ --llm offline --tts silent"

test_commands:
  - "pytest tests/ -v --tb=short"

notes: >
  The default run uses mock/offline LLM + silent TTS + Playwright rendering (with Pillow
  fallback), so it needs NO API keys and NO internet beyond setup. ffmpeg must be installed.
  For real TTS, set TTS_BACKEND=edge (needs internet) or TTS_BACKEND=espeak (needs espeak-ng).
  For real LLM, set LLM_BACKEND=claude and ensure the claude CLI is on PATH with CLAUDE_KEY set.
