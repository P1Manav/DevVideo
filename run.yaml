# Automated setup, demo, and verification commands.
# These are run exactly as written, in order, from a fresh checkout.

setup_commands:
  - "pip install -r requirements.txt -r requirements-dev.txt"
  - "playwright install chromium --with-deps"
  - "which ffmpeg >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq ffmpeg) || true"
  - "which espeak-ng >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq espeak-ng) || true"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py generate tests/fixtures/vidsearch_py --out out/"

test_commands:
  - "pytest tests/ -v"

notes: >
  DevVideo runs out-of-the-box with default backends (auto LLM selects offline planner when Claude
  CLI/key is absent; auto TTS selects edge, espeak-ng, or pyttsx3, and falls back gracefully).
  Output includes full explainer video with voice, subtitles, chapters, and retrieval index.
