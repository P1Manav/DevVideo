<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 70px;
    overflow: hidden;
  }
  .repo-badge {
    position: absolute;
    top: 25px;
    right: 70px;
    font-size: 14px;
    color: #bdc3c7;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 6px 16px;
    border-radius: 20px;
  }
  .scene-id {
    font-size: 15px;
    color: #95a5a6;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .content-box {
    background: rgba(10, 10, 25, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 30px;
    height: 460px;
    max-height: 460px;
    overflow: hidden;
    word-break: break-word;
    overflow-wrap: anywhere;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .content-box.code {
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace;
    font-size: 26px;
    line-height: 1.5;
    white-space: pre-wrap;
    color: #a8e6cf;
  }
  .content-box.text {
    font-size: 26px;
    line-height: 1.5;
    text-align: center;
    align-items: center;
    justify-content: center;
    color: #ffffff;
  }
  .content-box.diagram {
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace;
    font-size: 26px;
    line-height: 1.4;
    white-space: pre-wrap;
    color: #ffd93d;
  }
  .narration-preview {
    margin-top: 20px;
    font-size: 16px;
    color: #95a5a6;
    font-style: italic;
    line-height: 1.4;
    max-height: 50px;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="repo-badge">fixture_repo</div>
  <div class="scene-id">Scene: intro</div>
  <div class="content-box text">
    Fixture Repo<br>Developer Walkthrough
  </div>
  <div class="narration-preview">Welcome to this walkthrough of Fixture Repo. This is a sample project for testing the developer video generator. Built for developers integr...</div>
</body>
</html>
